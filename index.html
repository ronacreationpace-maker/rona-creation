<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="manifest" href="manifest.json">
    
    <title>RONA CREATION | Invoice System</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<!-- =========================
NAVBAR
========================= -->

<nav class="navbar navbar-dark bg-danger shadow">

    <div class="container-fluid">

        <span class="navbar-brand fw-bold">

            RONA CREATION

        </span>

        <span class="text-white">

            Sistem Invoice Digital

        </span>

    </div>

</nav>

<!-- =========================
CONTAINER
========================= -->

<div class="container py-4">

    <!-- Dashboard -->

<div class="row mb-4">

    <div class="col-md-3 mb-3">

        <div class="card border-0 shadow-sm">

            <div class="card-body text-center">

                <h6 class="text-muted">

                    📄 Total Invoice

                </h6>

                <h3 id="dashInvoice">

                    0

                </h3>

            </div>

        </div>

    </div>

    <div class="col-md-3 mb-3">

        <div class="card border-0 shadow-sm">

            <div class="card-body text-center">

                <h6 class="text-muted">

                    💰 Omzet Hari Ini

                </h6>

                <h5 id="dashHari">

                    Rp0

                </h5>

            </div>

        </div>

    </div>

    <div class="col-md-3 mb-3">

        <div class="card border-0 shadow-sm">

            <div class="card-body text-center">

                <h6 class="text-muted">

                    📅 Omzet Bulan Ini

                </h6>

                <h5 id="dashBulan">

                    Rp0

                </h5>

            </div>

        </div>

    </div>

    <div class="col-md-3 mb-3">

        <div class="card border-0 shadow-sm">

            <div class="card-body text-center">

                <h6 class="text-muted">

                    👥 Customer

                </h6>

                <h3 id="dashCustomer">

                    0

                </h3>

            </div>

        </div>

    </div>

</div>

<div class="card shadow">

<div class="card-header bg-danger text-white">

<h4 class="mb-0">

Invoice

</h4>

</div>

<div class="card-body">

<!-- =========================
HEADER
========================= -->

<div class="row">

    <div class="col-md-6 mb-3">

        <label class="form-label">

            No Invoice

        </label>

        <input
            type="text"
            id="invoice"
            class="form-control"
            readonly>

    </div>

    <div class="col-md-6 mb-3">

        <label class="form-label">

            Tanggal

        </label>

        <input
            type="date"
            id="tanggal"
            class="form-control">

    </div>

    <div class="col-md-3">

    <label class="form-label">
        Status
    </label>

    <select
        id="status"
        class="form-select">

        <option value="Belum Lunas" selected>
            Belum Lunas
        </option>

        <option value="Lunas">
            Lunas
        </option>

    </select>

</div>

</div>

<div class="row">

    <div class="col-md-6 mb-3">

        <label class="form-label">

            Customer

        </label>

        <input
            type="text"
            id="customer"
            class="form-control"
            placeholder="Nama Customer"
            list="customerList"
            autocomplete="off">

        <datalist id="customerList"></datalist>

    </div>

    <div class="col-md-6 mb-3">

        <label class="form-label">

            WhatsApp

        </label>

        <input
            type="text"
            id="wa"
            class="form-control"
            placeholder="08xxxxxxxxxx">

    </div>

</div>

<div class="mb-4">

    <label class="form-label">

        Alamat

    </label>

    <textarea
        id="alamat"
        rows="2"
        class="form-control"
        placeholder="Alamat Customer"></textarea>

</div>

<!-- =========================
DETAIL BARANG
========================= -->

<div class="table-responsive">

    <table class="table table-bordered align-middle">

        <thead class="table-danger">

            <tr>

                <th width="60">No</th>

                <th>Nama Barang</th>

                <th width="90">Qty</th>

                <th width="170">Harga</th>

                <th width="250">Total</th>

                <th width="70">Aksi</th>

            </tr>

        </thead>

        <tbody id="itemBody">

        </tbody>

    </table>

</div>

<div class="mt-3">

<button
id="btnTambah"
class="btn btn-primary">

+ Tambah Barang

</button>

</div>

<!-- =========================
TOTAL
========================= -->

<div class="row justify-content-end mt-4">

    <div class="col-lg-5">

        <table class="table">

            <tr>

                <th width="40%">Subtotal</th>

                <td>

                    <input
                        type="text"
                        id="subtotal"
                        class="form-control text-end"
                        value="Rp0"
                        readonly>

                </td>

            </tr>

            <tr>

                <th>Ongkir</th>

                <td>

                    <input
                        type="number"
                        id="ongkir"
                        class="form-control text-end"
                        value="0">

                </td>

            </tr>

            <tr>

                <th>Diskon</th>

                <td>

                    <input
                        type="number"
                        id="diskon"
                        class="form-control text-end"
                        value="0">

                </td>

            </tr>

            <tr>

                <th>DP</th>

                <td>

                    <input
                        type="number"
                        id="dp"
                        class="form-control text-end"
                        value="0">

                </td>

            </tr>

            <tr class="table-danger">

                <th>Grand Total</th>

                <td>

                    <input
                        type="text"
                        id="grandtotal"
                        class="form-control fw-bold text-end"
                        value="Rp0"
                        readonly>

                </td>

            </tr>

        </table>

    </div>

</div>

<!-- =========================
TOMBOL
========================= -->

<div class="text-end mt-4">

    <button id="btnSimpan" class="btn btn-success">
        💾 Simpan
    </button>

    <button id="btnCetak" class="btn btn-secondary">
        🖨 Cetak
    </button>

     <button id="btnWhatsApp" class="btn btn-success">
        📱 Kirim WhatsApp
    </button>

    <button id="btnHistory" class="btn btn-warning">
        📜 Riwayat
    </button>

    <button id="btnBackup" class="btn btn-info">
        📦 Backup
    </button>

    <button id="btnRestore" class="btn btn-primary">
        📂 Restore
    </button>

    <button id="btnReset" class="btn btn-danger">
        🔄 Reset
    </button>

    <input
        type="file"
        id="restoreFile"
        accept=".json"
        style="display:none">

</div>

<!-- =========================
MODAL RIWAYAT
========================= -->

<div class="modal fade" id="historyModal" tabindex="-1">

    <div class="modal-dialog modal-xl">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    📜 Riwayat Invoice
                </h5>

                <button
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <div class="row mb-3">

                    <div class="col-md-4">

                        <input
                            type="text"
                            id="searchInvoice"
                            class="form-control"
                            placeholder="🔍 Cari Invoice / Customer">

                    </div>

                </div>

                <div class="table-responsive">

                    <table
                        class="table table-hover table-bordered align-middle">

                        <thead class="table-danger">

<tr>
    <th>No Invoice</th>
    <th>Tanggal</th>
    <th>Customer</th>
    <th>Status</th>
    <th>Total</th>
    <th>Aksi</th>
</tr>

                        </thead>

                        <tbody id="historyBody">

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</div>

</div>
</div>
</div>

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Javascript -->
<script src="js/hitung.js"></script>
<script src="js/produk.js"></script>
<script src="js/invoice.js"></script>
<script src="js/dashboard.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="js/app.js"></script>
<script src="js/history.js"></script>
</body>
</html>
