<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Laporan Penjualan</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<style>

body{

    background:#f5f5f5;

    font-family:Arial,Helvetica,sans-serif;

}

.container{

    max-width:1200px;

    margin:30px auto;

}

.card{

    border:none;

    border-radius:10px;

    box-shadow:0 3px 12px rgba(0,0,0,.08);

}

.summary{

    font-size:18px;

    font-weight:bold;

}

.table th{

    background:#b10000;

    color:white;

}

</style>

</head>

<body>

<div class="container">

<div class="card">

<div class="card-body">

<h2 class="text-center text-danger mb-4">

📊 LAPORAN PENJUALAN

</h2>

<p class="text-center text-muted mb-4">

RONA CREATION

<br>

<span id="periodeCetak"></span>

</p>

<div class="row mb-4">

<div class="col-md-3">

<label>Dari</label>

<input
type="date"
id="tglAwal"
class="form-control">

</div>

<div class="col-md-3">

<label>Sampai</label>

<input
type="date"
id="tglAkhir"
class="form-control">

</div>

<div class="col-md-3 d-grid">

<label>&nbsp;</label>

<div class="d-flex gap-2">

    <button
        class="btn btn-danger"
        id="btnFilter">

        🔍 Tampilkan

    </button>

    <button
        class="btn btn-success"
        onclick="window.print()">

        🖨 Cetak

    </button>

     <button
        class="btn btn-primary"
        id="btnExcel">

        📊 Export Excel

    </button>
  
    <button
    class="btn btn-danger"
    id="btnPDF">

    📄 Export PDF

</button>

</div>

</div>

</div>

<hr>

<hr>

<div class="row g-3">

    <div class="col-md-3">
        <div class="card text-bg-primary">
            <div class="card-body text-center">
                <h6>Total Invoice</h6>
                <h3 id="jmlInvoice">0</h3>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card text-bg-success">
            <div class="card-body text-center">
                <h6>Total Customer</h6>
                <h3 id="jmlCustomer">0</h3>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card text-bg-warning">
            <div class="card-body text-center">
                <h6>Total Item</h6>
                <h3 id="jmlItem">0</h3>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card text-bg-danger">
            <div class="card-body text-center">
                <h6>Omzet</h6>
                <h5 id="omzet">Rp0</h5>
            </div>
        </div>
    </div>

</div>

<hr>

<div class="row g-3 mb-4">

    <div class="col-md-2">
        <div class="card">
            <div class="card-body text-center">
                <small>Subtotal</small>
                <h6 id="subtotalAll">Rp0</h6>
            </div>
        </div>
    </div>

    <div class="col-md-2">
        <div class="card">
            <div class="card-body text-center">
                <small>Ongkir</small>
                <h6 id="ongkirAll">Rp0</h6>
            </div>
        </div>
    </div>

    <div class="col-md-2">
        <div class="card">
            <div class="card-body text-center">
                <small>Diskon</small>
                <h6 id="diskonAll">Rp0</h6>
            </div>
        </div>
    </div>

    <div class="col-md-2">
        <div class="card">
            <div class="card-body text-center">
                <small>DP</small>
                <h6 id="dpAll">Rp0</h6>
            </div>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card border-danger">
            <div class="card-body text-center">
                <small><strong>Grand Total</strong></small>
                <h4 class="text-danger" id="grandAll">Rp0</h4>
            </div>
        </div>
    </div>

</div>

<div class="card mb-4">

    <div class="card-header bg-danger text-white">

        📈 Grafik Omzet Penjualan

    </div>

    <div class="card-body">

        <canvas id="chartOmzet" height="100"></canvas>

    </div>

</div>

<div class="table-responsive">

<table class="table table-bordered table-hover">

<thead>

<tr>

<th>No</th>

<th>Invoice</th>

<th>Tanggal</th>

<th>Customer</th>

<th>Status</th>

<th class="text-end">

Grand Total

</th>

</tr>

</thead>

<tbody id="laporanBody">

</tbody>

</table>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script src="js/laporan.js"></script>

</body>

</html>
